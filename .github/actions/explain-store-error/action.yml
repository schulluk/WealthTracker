name: Explain store error
description: >
  Reads an upload or submit log and names the cause and the fix. Apple and
  Google both answer a blocked release with a symptom, never a cause; this is
  the table of causes, grown one stopped release at a time.

inputs:
  platform:
    description: 'ios | android'
    required: true
  log:
    description: 'Log file to read. Pass the file the upload step tee-d to.'
    required: true
  extra-log:
    description: 'A second log file, optional.'
    default: ''

outputs:
  cause:
    description: 'Slug of the first matching cause, empty when nothing matched.'
    value: ${{ steps.classify.outputs.cause }}
  transient:
    description: 'true when every match is transient, i.e. re-running is the fix.'
    value: ${{ steps.classify.outputs.transient }}

runs:
  using: composite
  steps:
    - name: Classify
      id: classify
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        LOG: ${{ inputs.log }}
        EXTRA: ${{ inputs.extra-log }}
      run: |
        set -euo pipefail
        ARGS=(--platform "$PLATFORM" --log "$LOG")
        [ -n "$EXTRA" ] && ARGS+=(--log "$EXTRA")
        python3 "${{ github.action_path }}/scripts/classify.py" "${ARGS[@]}"
