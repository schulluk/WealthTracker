name: Changelog
description: >
  The version and release notes a release ships, from the changelog's
  "## Next" section; the store facts from store.yml; and, once a release went
  to review, the changelog update and the vX.Y.Z tag. The logic is
  changelog.rb next to this file, which a release from a laptop uses too.

inputs:
  command:
    description: >
      plan = version, notes and mode for this run. release = turn "## Next"
      into "## X.Y.Z (date)", tag the built commit, push both. store =
      store.yml as JSON.
    required: true
  changelog:
    description: 'The changelog, from the repository root.'
    default: CHANGELOG.md
  store:
    description: 'store.yml, from the repository root. A missing file reads as empty.'
    default: ''
  bump:
    description: 'plan: major | minor | patch, counted from the newest "## X.Y.Z".'
    default: minor
  version:
    description: 'release: the version that went to review.'
    default: ''
  released-ref:
    description: >
      release: the commit that was built. Only what its "## Next" held moves
      into the version; lines added while the release ran stay under "## Next".
    default: ''

outputs:
  version:
    description: 'plan: X.Y.Z'
    value: ${{ steps.run.outputs.version }}
  mode:
    description: >
      plan: new (counted from "## Next") or repeat (dispatched on a vX.Y.Z
      tag: the same version and notes again, for a platform that failed).
    value: ${{ steps.run.outputs.mode }}
  notes:
    description: 'plan: the release notes for the stores.'
    value: ${{ steps.run.outputs.notes }}
  store:
    description: 'store: store.yml as one line of JSON, {} when there is none.'
    value: ${{ steps.run.outputs.store }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        CHANGELOG: ${{ inputs.changelog }}
        STORE: ${{ inputs.store }}
        BUMP: ${{ inputs.bump }}
        VERSION: ${{ inputs.version }}
        RELEASED_REF: ${{ inputs.released-ref }}
      run: |
        set -euo pipefail
        cl() { ruby "$GITHUB_ACTION_PATH/changelog.rb" "$@"; }
        output() { # NAME VALUE; safe for several lines
          local eof="EOF_$(openssl rand -hex 8)"
          printf '%s<<%s\n%s\n%s\n' "$1" "$eof" "$2" "$eof" >> "$GITHUB_OUTPUT"
        }

        case "$COMMAND" in
          plan)
            if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              # The tag's commit still has the "## Next" that shipped as this
              # version, so its notes come out exactly as they did then.
              MODE=repeat
              VERSION="${BASH_REMATCH[1]}"
            else
              MODE=new
              cl check --changelog "$CHANGELOG"
              VERSION=$(cl version --changelog "$CHANGELOG" --bump "$BUMP")
              if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
                echo "::error::The tag v$VERSION exists, but $CHANGELOG has no '## $VERSION'. To repeat that release, dispatch this workflow on the tag; otherwise add the missing section."
                exit 1
              fi
            fi
            NOTES=$(cl notes --changelog "$CHANGELOG" --store "$STORE")
            output version "$VERSION"
            output mode "$MODE"
            output notes "$NOTES"
            if [ "$MODE" = repeat ]; then
              echo "::notice::Repeating $VERSION from $GITHUB_REF_NAME."
            else
              echo "::notice::## Next ships as $VERSION ($BUMP)."
            fi
            {
              echo "### Release $VERSION"
              echo ""
              if [ "$MODE" = repeat ]; then
                echo "Repeat of \`$GITHUB_REF_NAME\`."
              else
                echo "\`## Next\` in \`$CHANGELOG\`, counted as a $BUMP step."
              fi
              echo ""
              echo "Release notes (${#NOTES} characters):"
              echo ""
              echo '```'
              echo "$NOTES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ;;

          release)
            [ -n "$VERSION" ] && [ -n "$RELEASED_REF" ] || { echo "::error::release needs version and released-ref."; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # main may have moved while the release ran; start over from it
            # and try again if someone pushes in between.
            for attempt in 1 2 3; do
              git fetch --quiet origin main
              git checkout --quiet -B main origin/main
              cl release --changelog "$CHANGELOG" --version "$VERSION" --released-ref "$RELEASED_REF"
              git add "$CHANGELOG"
              git commit --quiet -m "Changelog: $VERSION went to review"
              git tag -f "v$VERSION" "$RELEASED_REF" > /dev/null
              if git push --atomic origin main "refs/tags/v$VERSION"; then
                echo "::notice::$CHANGELOG: ## Next is now ## $VERSION, and $(git rev-parse --short "$RELEASED_REF") is tagged v$VERSION."
                exit 0
              fi
              echo "Push refused (attempt $attempt of 3); main moved, starting over."
              sleep $((attempt * 5))
            done
            echo "::error::Could not push the changelog update. The stores have $VERSION; turn '## Next' into '## $VERSION' by hand (changelog.rb release --version $VERSION) and tag $RELEASED_REF as v$VERSION."
            exit 1
            ;;

          store)
            output store "$(cl store --store "$STORE")"
            ;;

          *)
            echo "::error::command is plan, release or store, not '$COMMAND'."
            exit 1
            ;;
        esac
