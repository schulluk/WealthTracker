name: Release

# Copy to .github/workflows/release.yml in the app repo and fill in the
# CONFIGURE block. Everything else is shared: the two reusable workflows do
# the building, signing, verifying and uploading.
#
# This ships the NEXT version of an app that is already set up: it exists in
# both consoles, the listing, screenshots, ratings and agreements are done, and
# a human has released it by hand at least once. It never creates an app,
# touches the listing or replaces screenshots.
#
# The version and the release notes come from the changelog. "## Next" ships
# as the newest "## X.Y.Z" plus one minor (bump: patch or major for the
# others); the stores get its "### Public" part, or store.yml's default line
# when that is empty. Once a release went to review (submit), "## Next"
# becomes "## X.Y.Z (date)", a new "## Next" opens, and the built commit is
# tagged vX.Y.Z. Until then every run builds the same version again, so
# TestFlight and internal builds never use up a number.
#
# Dispatched on a vX.Y.Z tag instead of main, it repeats that release: same
# version, same notes. That is how a platform that failed is sent again.
#
# To test a change to this file, dispatch it with dry_run: both platforms
# build and sign, and nothing is uploaded or committed.

run-name: >-
  ${{ github.ref_type == 'tag' && format('Repeat {0}', github.ref_name) || format('Next ({0})', inputs.bump) }}
  ${{ inputs.platforms }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'How far ## Next counts on from the last release. Ignored on a vX.Y.Z tag.'
        type: choice
        options: [minor, patch, major]
        default: minor
      platforms:
        description: 'Which stores'
        type: choice
        options: [both, ios, android]
        default: both
      ios_track:
        description: 'appstore = create the App Store version. testflight = only append the build (works while an earlier version is in review).'
        type: choice
        options: [appstore, testflight]
        default: appstore
      play_track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_notes:
        description: "Overrides the changelog. Empty takes ## Next's ### Public: in full for TestFlight and the App Store, whole lines within 500 characters for Play."
        type: string
        default: ''
      submit:
        description: 'Submit for review after uploading, and mark ## Next as released. Leave off until one release has gone through with it off.'
        type: boolean
        default: false
      dry_run:
        description: 'Build and sign everything, upload and commit nothing.'
        type: boolean
        default: false

concurrency:
  # Never two uploads for one app at once, and never cancel one halfway
  # through a store upload. A dry run gets its own group so testing the
  # pipeline cannot cancel a real release.
  group: release-${{ inputs.dry_run && 'dry' || 'real' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # CONFIGURE: the changelog and store.yml, from the repository root.
      CHANGELOG: app/CHANGELOG.md
      STORE_FILE: app/store.yml
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      notes: ${{ steps.plan.outputs.notes }}
      changelog: ${{ steps.paths.outputs.changelog }}
      store_file: ${{ steps.paths.outputs.store_file }}
      ios: ${{ steps.platforms.outputs.ios }}
      android: ${{ steps.platforms.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only commits on main may be released
        # A dry run is how a branch gets tested, so this applies to real runs
        # only — otherwise the one way to exercise a pipeline change is also
        # the one thing this check forbids.
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # No git fetch: the checkout keeps no credentials, so a fetch fails
          # on a private repo, and fetch-depth: 0 already brought origin/main.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main. Only merged commits get released."
            exit 1
          fi

      - name: Version and notes from the changelog
        id: plan
        uses: ./.github/actions/changelog
        with:
          command: plan
          changelog: ${{ env.CHANGELOG }}
          store: ${{ env.STORE_FILE }}
          bump: ${{ inputs.bump }}

      - name: Platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          IOS=true; ANDROID=true
          [ "$PLATFORMS" = android ] && IOS=false
          [ "$PLATFORMS" = ios ] && ANDROID=false
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"

      - name: Hand on the paths
        id: paths
        run: |
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "store_file=$STORE_FILE" >> "$GITHUB_OUTPUT"

  # ─────────────────────────── CONFIGURE ───────────────────────────
  # stack, the ids, the toolchain versions and the paths. Everything else
  # has a default that fits a standard Flutter project. Facts about the
  # listing (the App Review contact, What's New in the other languages) go
  # into store.yml, not here.

  android:
    name: Android
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      stack: flutter
      app_dir: app
      flutter_version: '3.47.4'
      java_version: '17'
      package_name: ch.miniapps.wealthtracker
      key_alias: ${{ vars.ANDROID_KEY_ALIAS }}
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ inputs.play_track }}
      # completed sends the release for review; with managed publishing on in
      # Play Console it still waits for a human to press Publish. draft is for
      # an app that has never been published.
      release_status: ${{ inputs.submit && 'completed' || 'draft' }}
      release_notes: ${{ inputs.release_notes || needs.prepare.outputs.notes }}
      store_file: ${{ needs.prepare.outputs.store_file }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  ios:
    name: iOS
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      stack: flutter
      app_dir: app
      flutter_version: '3.47.4'
      xcode_version: '27.2'
      # macos-26 tops out at Xcode 26.6; xcode-27 is GitHub's preview image
      # with 27.0 to 27.2, the Xcode the app is built with locally.
      runner: xcode-27
      bundle_id: ch.miniapps.wealthtracker
      apple_team_id: ${{ vars.APPLE_TEAM_ID }}
      # No Runner.entitlements: no push, no app groups, nothing to repair.
      entitlements_path: ''
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ inputs.ios_track }}
      release_notes: ${{ inputs.release_notes || needs.prepare.outputs.notes }}
      store_file: ${{ needs.prepare.outputs.store_file }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # Submitting for review is deliberately a separate, opt-in job: it is the one
  # step a human usually wants to look at, and Apple needs the build processed
  # first (up to two hours), which is API polling and belongs on Linux where
  # the minutes are ten times cheaper. Every version is released as soon as
  # Apple approves it; the ios workflow sets that on the version.
  submit-ios:
    name: iOS submit
    needs: [prepare, ios]
    if: >-
      inputs.submit && !inputs.dry_run
      && needs.prepare.outputs.ios == 'true'
      && needs.ios.result == 'success'
      && inputs.ios_track == 'appstore'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: production
    steps:
      # Needed once this file is vendored: vendor-store-release.sh rewrites the
      # `uses:` below to ./.github/actions/setup-toolchain, and a local action
      # only resolves if the repository is checked out first. Harmless while the
      # reference is still remote.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          stack: none
      - name: Submit for review
        # CONFIGURE: the directory that holds fastlane/ (app_dir + /ios for a
        # standard Flutter layout). Run deliver anywhere else and, because
        # --skip_binary_upload leaves it nothing to do but metadata, it goes
        # looking for a deliver configuration, finds none, and asks "Do you
        # want to setup deliver?" -- an instant crash on a runner:
        # "Could not retrieve response as fastlane runs in non-interactive
        # mode". --force does not suppress it; the question comes before any
        # config is read. The ios job never hits this because it passes an IPA.
        working-directory: app/ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          # CONFIGURE: same bundle id as the ios job.
          BUNDLE_ID: ch.miniapps.wealthtracker
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
        run: |
          set -euo pipefail
          printf '%s' "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          jq -n --arg id "$KEY_ID" --arg issuer "$ISSUER" --rawfile key "$RUNNER_TEMP/asc.p8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, duration: 1200, in_house: false}' > "$RUNNER_TEMP/asc.json"
          trap 'rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/asc.json"' EXIT
          # No binary upload: this attaches the build the ios job already
          # uploaded to the version and sends that version to review. The
          # release type is not set here: next to --skip_metadata deliver
          # ignores --automatic_release, so the ios workflow sets it.
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc.json" \
            --app_identifier "$BUNDLE_ID" \
            --app_version "$VERSION" \
            --build_number "$BUILD_NUMBER" \
            --skip_binary_upload true \
            --skip_screenshots true \
            --skip_metadata true \
            --submit_for_review true \
            --run_precheck_before_submit false \
            --force true

  # Once a store has this version for review, the changelog says so: "## Next"
  # becomes "## X.Y.Z (date)", a new "## Next" opens, and the commit that was
  # built is tagged vX.Y.Z. It runs even when the other platform failed,
  # because the version is taken now; dispatch this workflow on the tag to
  # send the failed one again. Lines added to "## Next" while the release ran
  # stay there.
  changelog:
    name: Changelog
    needs: [prepare, android, ios, submit-ios]
    if: >-
      always() && inputs.submit && !inputs.dry_run
      && needs.prepare.outputs.mode == 'new'
      && (needs.submit-ios.result == 'success'
          || (inputs.play_track == 'production'
              && contains(fromJSON('["sent","held"]'), needs.android.outputs.review)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/changelog
        with:
          command: release
          changelog: ${{ needs.prepare.outputs.changelog }}
          version: ${{ needs.prepare.outputs.version }}
          released-ref: ${{ github.sha }}
