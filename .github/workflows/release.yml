name: Release

# The same file in every app repo: copied by tools/vendor-store-release.sh,
# never edited by hand. What differs between apps (stack, ids, toolchain,
# build command, review contact, release-note lines) lives in the app's
# store.yml, which `./release.sh --local` reads as well, so a release from a
# laptop builds exactly what this builds.
#
# The version and the release notes come from the changelog. "## Next" ships
# as the newest "## X.Y.Z" plus one minor (bump: patch or major for the
# others); the stores get its "### Public" part, or store.yml's default line
# when that is empty. Once a release went to review (submit), "## Next"
# becomes "## X.Y.Z (date)", a new "## Next" opens, and the built commit is
# tagged vX.Y.Z. Until then every run builds the same version again, so
# TestFlight and internal builds never use up a number.
#
# Dispatched on a vX.Y.Z tag instead of main, it repeats that release: same
# version, same notes. That is how a platform that failed is sent again.
#
# Start it with ./release.sh (which follows the run), or here. To test a
# change to the pipeline, dispatch it with dry_run: everything builds and
# signs, nothing is uploaded or committed.

run-name: >-
  ${{ github.ref_type == 'tag' && format('Repeat {0}', github.ref_name) || format('Next ({0})', inputs.bump) }}
  ${{ inputs.platforms }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'How far ## Next counts on from the last release. Ignored on a vX.Y.Z tag.'
        type: choice
        options: [minor, patch, major]
        default: minor
      platforms:
        description: 'Which stores (of those store.yml has)'
        type: choice
        options: [both, ios, android]
        default: both
      ios_track:
        description: 'appstore = create the App Store version. testflight = only append the build (works while an earlier version is in review).'
        type: choice
        options: [appstore, testflight]
        default: appstore
      play_track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_notes:
        description: "Overrides the changelog. Empty takes ## Next's ### Public: in full for TestFlight and the App Store, whole lines within 500 characters for Play."
        type: string
        default: ''
      submit:
        description: 'Submit for review after uploading, and mark ## Next as released.'
        type: boolean
        default: false
      dry_run:
        description: 'Build and sign everything, upload and commit nothing.'
        type: boolean
        default: false

concurrency:
  # Never two uploads for one app at once, and never cancel one halfway
  # through a store upload. A dry run gets its own group so testing the
  # pipeline cannot cancel a real release.
  group: release-${{ inputs.dry_run && 'dry' || 'real' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      notes: ${{ steps.plan.outputs.notes }}
      ios: ${{ steps.platforms.outputs.ios }}
      android: ${{ steps.platforms.outputs.android }}
      ios_runner: ${{ steps.config.outputs.ios_runner }}
      android_runner: ${{ steps.config.outputs.android_runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only commits on main may be released
        # A dry run is how a branch gets tested, so this applies to real runs
        # only; a vX.Y.Z tag was on main when it was made.
        if: ${{ !inputs.dry_run && github.ref_type != 'tag' }}
        run: |
          set -euo pipefail
          # No git fetch: the checkout keeps no credentials, so a fetch fails
          # on a private repo, and fetch-depth: 0 already brought origin/main.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main. Only merged commits get released."
            exit 1
          fi

      - name: store.yml
        id: config
        run: ruby .github/store-release/config.rb github

      - name: Version and notes from the changelog
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: .github/store-release/changelog.sh plan

      - name: Platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
          HAS_IOS: ${{ steps.config.outputs.ios }}
          HAS_ANDROID: ${{ steps.config.outputs.android }}
        run: |
          set -euo pipefail
          IOS=$HAS_IOS; ANDROID=$HAS_ANDROID
          [ "$PLATFORMS" = android ] && IOS=false
          [ "$PLATFORMS" = ios ] && ANDROID=false
          if [ "$IOS$ANDROID" = falsefalse ]; then
            echo "::error::Nothing to release: store.yml has no $PLATFORMS section."
            exit 1
          fi
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ inputs.play_track }}
      # completed sends the release for review; with managed publishing on in
      # Play Console it still waits for a human to press Publish. draft is for
      # an app that has never been published.
      release_status: ${{ inputs.submit && 'completed' || 'draft' }}
      release_notes: ${{ inputs.release_notes || needs.prepare.outputs.notes }}
      runner: ${{ needs.prepare.outputs.android_runner }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  ios:
    name: iOS
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ inputs.ios_track }}
      release_notes: ${{ inputs.release_notes || needs.prepare.outputs.notes }}
      runner: ${{ needs.prepare.outputs.ios_runner }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # Submitting waits until Apple has processed the build (up to two hours),
  # which is API polling and belongs on Linux, where the minutes are ten times
  # cheaper. Every version is released as soon as Apple approves it; the ios
  # workflow sets that on the version.
  submit-ios:
    name: iOS submit
    needs: [prepare, ios]
    if: >-
      inputs.submit && !inputs.dry_run
      && needs.prepare.outputs.ios == 'true'
      && needs.ios.result == 'success'
      && needs.ios.outputs.review == 'uploaded'
      && inputs.ios_track == 'appstore'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          stack: none
      - name: Submit for review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
        run: .github/store-release/ios.sh submit

  # Once a store has this version for review, the changelog says so: "## Next"
  # becomes "## X.Y.Z (date)", a new "## Next" opens, and the commit that was
  # built is tagged vX.Y.Z. It runs even when the other platform failed,
  # because the version is taken now; dispatch this workflow on the tag to
  # send the failed one again. Lines added to "## Next" while the release ran
  # stay there.
  changelog:
    name: Changelog
    needs: [prepare, android, ios, submit-ios]
    if: >-
      always() && inputs.submit && !inputs.dry_run
      && needs.prepare.outputs.mode == 'new'
      && (needs.submit-ios.result == 'success'
          || (inputs.play_track == 'production'
              && contains(fromJSON('["sent","held"]'), needs.android.outputs.review)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Mark the version as released
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASED_REF: ${{ github.sha }}
        run: .github/store-release/changelog.sh release
