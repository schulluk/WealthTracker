name: Release build (iOS)

# Archives, signs, exports and uploads an iOS build to App Store Connect.
#
# Reusable: the app's release.yml calls this with `uses:` and
# `secrets: inherit`. Every step is a command of .github/store-release/ios.sh,
# the same one `release.sh --local` runs on a Mac; this file only decides
# where each one runs and hands it the secrets. How the app is built (stack,
# ids, toolchain, build command) comes from its store.yml.
#
# Where things run, and why:
#   * preflight asks Apple first, in a Linux job of its own. A review in
#     flight, an outstanding agreement or an expiring certificate then costs
#     seconds of Linux time, and a held-back iOS never starts a Mac at all.
#   * the Mac does only what needs a Mac: archive, sign, export, upload. Its
#     timeout is 45 minutes (a release takes about 8), so a hang costs at most
#     that, not two hours of macOS minutes.
#   * signing happens in a throwaway keychain that is deleted even when the
#     job fails.
#   * the Mac never waits for Apple's processing: TestFlight's What to Test,
#     and What's New with the App Review contact on the appstore track, are
#     written by Linux jobs, and an App Store submission waits in the caller's
#     Linux submit job.
#   * a dry run archives, signs and exports, and uploads nothing.

on:
  workflow_call:
    inputs:
      version:
        description: 'X.Y.Z'
        type: string
        required: true
      track:
        description: >
          appstore = deliver, which creates the App Store version (and refuses
          while an earlier one is in review). testflight = pilot, which only
          appends the build and works during a review.
        type: string
        default: appstore
      build_number:
        description: "Override. Empty takes store.yml's ios.build_number scheme."
        type: string
        default: ''
      release_notes:
        description: >
          TestFlight's What to Test (track testflight) or the App Store
          version's What's New (track appstore), written by a Linux job after
          the upload. The other languages get store.yml's lines.
        type: string
        default: ''
      runner:
        description: "store.yml's ios.runner, which the caller's prepare job reads."
        type: string
        default: macos-26
      preflight:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      environment:
        type: string
        default: production
      timeout_minutes:
        description: >
          For the macOS job. A release takes about 8 minutes there; anything
          near this limit is a hang, billed at ten times the Linux rate.
        type: number
        default: 45
    outputs:
      build_number:
        value: ${{ jobs.ios.outputs.build_number }}
      review:
        description: 'uploaded | dry-run | skipped | held (preflight held iOS back, nothing was built)'
        value: ${{ jobs.ios.outputs.review || (jobs.preflight.outputs.ok == 'false' && 'held') || 'skipped' }}
    secrets:
      APPLE_DISTRIBUTION_P12_B64:
        required: false
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_B64:
        required: false
      # Build-time values that must not be committed (a RevenueCat key), as one
      # flat JSON object; the build gets it via --dart-define-from-file.
      DART_DEFINES_JSON:
        required: false
      # The app's own secret files, for values the platform reads rather than
      # Dart (a Maps SDK key in an xcconfig): one JSON object of path (relative
      # to the app directory) to contents. Written before the build, removed
      # after it.
      APP_SECRET_FILES_JSON:
        required: false
      # Fill in what store.yml's app_review leaves empty, for a public repo
      # that should not show an email address or phone number.
      APP_REVIEW_FIRST_NAME:
        required: false
      APP_REVIEW_LAST_NAME:
        required: false
      APP_REVIEW_EMAIL:
        required: false
      APP_REVIEW_PHONE:
        required: false

jobs:
  preflight:
    name: iOS preflight ${{ inputs.version }}
    if: inputs.preflight && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      ok: ${{ steps.preflight.outputs.ios_ok }}
      reason: ${{ steps.preflight.outputs.ios_reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: store.yml
        id: config
        run: ruby .github/store-release/config.rb github

      - name: Preflight
        id: preflight
        uses: ./.github/actions/preflight
        with:
          platforms: ios
          version: ${{ inputs.version }}
          ios-bundle-id: ${{ steps.config.outputs.ios_bundle_id }}
          ios-track: ${{ inputs.track }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-key-p8-base64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}

      - name: Held back
        if: steps.preflight.outputs.ios_ok == 'false'
        env:
          VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
          REASON: ${{ steps.preflight.outputs.ios_reason }}
        run: |
          echo "::warning::iOS is held back this run, so no Mac starts and nothing is built: $REASON"
          {
            echo "### iOS $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| track | \`$TRACK\` |"
            echo "| result | held back: $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS ${{ inputs.version }}
    needs: preflight
    # Runs when preflight let iOS through, and when there was no preflight
    # (a dry run, or preflight: false). A failed preflight stops it.
    if: >-
      !cancelled()
      && (needs.preflight.result == 'skipped'
          || (needs.preflight.result == 'success' && needs.preflight.outputs.ok != 'false'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    outputs:
      build_number: ${{ steps.prepare.outputs.build_number }}
      review: ${{ steps.upload.outputs.review }}
    env:
      VERSION: ${{ inputs.version }}
      TRACK: ${{ inputs.track }}
      DRY_RUN: ${{ inputs.dry_run }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # store.yml's build_number: commits counts the whole history.
          fetch-depth: 0

      - name: store.yml
        id: config
        run: ruby .github/store-release/config.rb github

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          stack: ${{ steps.config.outputs.ios_stack }}
          flutter-version: ${{ steps.config.outputs.flutter }}
          xcode-version: ${{ steps.config.outputs.ios_xcode }}
          # Always: sigh fetches the App Store profiles, even for a dry run.
          install-fastlane: 'true'

      - name: Build number, key and keychain
        id: prepare
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          APPLE_DISTRIBUTION_P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: .github/store-release/ios.sh prepare

      - name: App secret files
        # Never through an input, which would put them in a process listing.
        uses: ./.github/actions/secret-files
        with:
          command: write
          dir: ${{ steps.config.outputs.app_dir }}
          files: ${{ secrets.APP_SECRET_FILES_JSON }}

      - name: Archive
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: .github/store-release/ios.sh archive

      - name: Export and sign
        run: .github/store-release/ios.sh export

      - name: Upload artifact
        # Even when the upload fails: the signed IPA is then the one thing
        # worth keeping from the run.
        if: always() && env.IPA_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.version }}-${{ steps.prepare.outputs.build_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to App Store Connect
        id: upload
        run: .github/store-release/ios.sh upload

      - name: Remove the app secret files
        if: always()
        uses: ./.github/actions/secret-files
        with:
          command: clean
          dir: ${{ steps.config.outputs.app_dir }}

      - name: Clean up the keychain
        if: always()
        run: .github/store-release/ios.sh cleanup

      - name: Summary
        if: always()
        env:
          REVIEW: ${{ steps.upload.outputs.review }}
        run: .github/store-release/ios.sh summary

  # What to Test can be set once Apple lists the uploaded build, a few minutes
  # after the upload. That wait is a sleep, and it belongs on Linux.
  testflight-notes:
    name: TestFlight notes ${{ inputs.version }}
    needs: ios
    if: >-
      inputs.track == 'testflight' && inputs.release_notes != ''
      && !inputs.dry_run && needs.ios.outputs.review == 'uploaded'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          stack: none
      - name: Attach What to Test
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
          NOTES: ${{ inputs.release_notes }}
        run: .github/store-release/ios.sh testflight-notes

  # What's New, the App Review contact and the release type for the App Store
  # version the upload created. Apple copies none of them from the previous
  # version and refuses a submission without the first two, so this runs
  # before the caller's submit job.
  appstore-notes:
    name: App Store notes ${{ inputs.version }}
    needs: ios
    if: >-
      inputs.track == 'appstore' && !inputs.dry_run
      && needs.ios.outputs.review == 'uploaded'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          stack: none
      - name: Write What's New, the review contact and the release type
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: .github/store-release/ios.sh appstore-notes
