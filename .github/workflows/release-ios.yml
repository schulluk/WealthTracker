name: Release build (iOS)

# Archives, signs, exports and uploads an iOS build to App Store Connect.
#
# Reusable: an app repo's orchestrator calls this with `uses:` and
# `secrets: inherit`.
#
# Deliberate choices, each one a release that stopped once:
#   * preflight asks Apple first. A review in flight, an outstanding agreement
#     or an expiring certificate costs seconds here instead of 40 minutes of
#     macOS runner time.
#   * signing happens in a throwaway keychain that is deleted even when the
#     job fails.
#   * `flutter build ipa --no-codesign` plus `xcodebuild -exportArchive` signs
#     with the bare minimum entitlements and silently drops aps-environment
#     and associated-domains, which kills push notifications. This workflow
#     compares the exported IPA's entitlements with the project's, re-signs
#     only when something is missing, and verifies the result.
#   * the App Store upload rejects a queued submission for you
#     (reject_if_possible); a review Apple already started cannot be undone,
#     which is what track=testflight is for.
#   * a dry run archives, signs and exports, and uploads nothing.

on:
  workflow_call:
    inputs:
      stack:
        description: 'flutter | ios-xcode'
        type: string
        required: true
      version:
        description: 'X.Y.Z'
        type: string
        required: true
      bundle_id:
        description: 'e.g. ch.example.app'
        type: string
        required: true
      apple_team_id:
        description: 'The 10-character team id (not a secret).'
        type: string
        required: true
      app_dir:
        type: string
        default: '.'
      track:
        description: >
          appstore = deliver, which creates the App Store version (and refuses
          while an earlier one is in review). testflight = pilot, which only
          appends the build and works during a review.
        type: string
        default: appstore
      build_number:
        description: 'Override. Empty means seconds since 2026-01-01 UTC.'
        type: string
        default: ''
      release_notes:
        description: "TestFlight 'What to Test'. Ignored on the appstore track, where the notes belong to the store listing."
        type: string
        default: ''
      flutter_version:
        description: 'Required for stack=flutter.'
        type: string
        default: ''
      xcode_version:
        description: 'e.g. 26.6. Empty leaves the runner default, which moves without warning.'
        type: string
        default: ''
      build_command:
        description: >
          Override the archive step. Required for stack=ios-xcode. VERSION and
          BUILD_NUMBER are in the environment; it must leave an xcarchive at
          archive_path.
        type: string
        default: ''
      extra_build_args:
        description: 'Appended to the default Flutter build command.'
        type: string
        default: ''
      archive_path:
        description: 'xcarchive path relative to app_dir.'
        type: string
        default: build/ios/archive/Runner.xcarchive
      app_name:
        description: 'The .app inside the archive and the IPA payload.'
        type: string
        default: Runner.app
      entitlements_path:
        description: >
          The project's entitlements file, relative to app_dir. Used to detect
          and repair entitlements the export dropped. Empty disables the check.
        type: string
        default: ios/Runner/Runner.entitlements
      extension_entitlements:
        description: >
          One line per app extension, `<Name>.appex=<entitlements file relative
          to app_dir>`, e.g. a widget's app group. Checked and repaired like
          the app's own; extensions are re-signed inside out, never with --deep,
          which would give them the app's entitlements.
        type: string
        default: ''
      preflight:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      runner:
        type: string
        default: macos-26
      environment:
        type: string
        default: production
      timeout_minutes:
        type: number
        default: 120
    outputs:
      build_number:
        value: ${{ jobs.ios.outputs.build_number }}
      review:
        description: 'uploaded | dry-run | skipped'
        value: ${{ jobs.ios.outputs.review }}
    secrets:
      APPLE_DISTRIBUTION_P12_B64:
        required: false
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_B64:
        required: false
      # Build-time values that must not be committed (a RevenueCat key, an
      # API endpoint), as one flat JSON object; the Flutter build gets it via
      # --dart-define-from-file. tools/set-store-secrets.sh --dart-defines sets it.
      DART_DEFINES_JSON:
        required: false

jobs:
  ios:
    name: iOS ${{ inputs.version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    outputs:
      build_number: ${{ steps.resolve.outputs.build_number }}
      review: ${{ steps.upload.outputs.review || 'skipped' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$P12" ] || missing="$missing APPLE_DISTRIBUTION_P12_B64"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing APP_STORE_CONNECT_API_KEY_P8_B64"
          if [ -n "$missing" ]; then
            echo "::error::Missing on the ${{ inputs.environment }} environment:$missing. The store-release skill sets them: skills/store-release/references/secrets.md"
            exit 1
          fi
          # The export needs the API key even for a dry run: Apple issues the
          # provisioning profile at export time.

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          stack: ${{ inputs.stack }}
          flutter-version: ${{ inputs.flutter_version }}
          xcode-version: ${{ inputs.xcode_version }}
          install-fastlane: ${{ inputs.dry_run == false }}

      - name: Preflight
        id: preflight
        if: inputs.preflight && !inputs.dry_run
        uses: ./.github/actions/preflight
        with:
          platforms: ios
          version: ${{ inputs.version }}
          ios-bundle-id: ${{ inputs.bundle_id }}
          ios-track: ${{ inputs.track }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-key-p8-base64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}

      - name: Held back
        id: gate
        env:
          OK: ${{ steps.preflight.outcome == 'skipped' && 'true' || steps.preflight.outputs.ios_ok }}
          REASON: ${{ steps.preflight.outputs.ios_reason }}
        run: |
          set -euo pipefail
          if [ "$OK" = false ]; then
            echo "::warning::iOS is held back this run, so nothing is built: $REASON"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build number
        id: resolve
        if: steps.gate.outputs.proceed == 'true'
        env:
          GIVEN: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # The same clock scheme as Android, so one release carries one number
          # on both stores and a laptop build can never collide with CI.
          NUMBER="${GIVEN:-$(( $(date -u +%s) - 1767225600 ))}"
          [ "$NUMBER" -gt 0 ] || { echo "::error::build number $NUMBER is not usable"; exit 1; }
          echo "build_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice title=iOS::${{ inputs.version }} ($NUMBER)"

      - name: Write the App Store Connect key
        if: steps.gate.outputs.proceed == 'true'
        env:
          P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"
          # fastlane's CLI takes the key as one JSON file, which is why no
          # Fastfile is needed here: the app's own fastlane setup is untouched.
          jq -n --arg id "$KEY_ID" --arg issuer "$ISSUER" --rawfile key "$RUNNER_TEMP/asc-key.p8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, duration: 1200, in_house: false}' \
            > "$RUNNER_TEMP/asc-key.json"
          chmod 600 "$RUNNER_TEMP/asc-key.json"

      - name: Setup signing
        if: steps.gate.outputs.proceed == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${P12_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Ours first, then the ones that were there (one word each, on purpose).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -m1 "Apple Distribution" | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Apple Distribution identity in the keychain. APPLE_DISTRIBUTION_P12_B64 is not a distribution certificate with its private key, or APPLE_DISTRIBUTION_P12_PASSWORD is wrong."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "::notice::Signing as $IDENTITY"

      - name: Dependencies
        if: steps.gate.outputs.proceed == 'true' && inputs.stack == 'flutter'
        working-directory: ${{ inputs.app_dir }}
        run: flutter pub get

      - name: Archive
        if: steps.gate.outputs.proceed == 'true'
        working-directory: ${{ inputs.app_dir }}
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ steps.resolve.outputs.build_number }}
          STACK: ${{ inputs.stack }}
          COMMAND: ${{ inputs.build_command }}
          EXTRA: ${{ inputs.extra_build_args }}
          DEFINES: ${{ secrets.DART_DEFINES_JSON }}
        run: |
          set -euo pipefail
          # Build defines from the DART_DEFINES_JSON secret go in as a file:
          # a --dart-define argument would be in every process listing.
          DART_DEFINES_ARG=""
          if [ -n "$DEFINES" ]; then
            DEFINES_FILE="$RUNNER_TEMP/dart-defines.json"
            trap 'rm -f "$DEFINES_FILE"' EXIT
            printf '%s' "$DEFINES" > "$DEFINES_FILE"
            chmod 600 "$DEFINES_FILE"
            if ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d, dict) and d; print("::notice::Build defines: " + ", ".join(sorted(d)))' "$DEFINES_FILE"; then
              echo "::error::DART_DEFINES_JSON is not a non-empty JSON object."
              exit 1
            fi
            DART_DEFINES_ARG="--dart-define-from-file=$DEFINES_FILE"
          fi
          # A build_command can pass it on itself.
          export DART_DEFINES_ARG
          if [ -n "$COMMAND" ]; then
            bash -c "$COMMAND"
          elif [ "$STACK" = flutter ]; then
            # Unsigned, then exported with distribution signing: archiving
            # signed needs a development certificate the runner does not have.
            # shellcheck disable=SC2086
            flutter build ipa --no-codesign \
              --build-name="$VERSION" --build-number="$BUILD_NUMBER" $EXTRA $DART_DEFINES_ARG
          else
            echo "::error::stack=ios-xcode needs build_command, leaving an xcarchive at archive_path."
            exit 1
          fi

      - name: Export IPA
        if: steps.gate.outputs.proceed == 'true'
        working-directory: ${{ inputs.app_dir }}
        env:
          ARCHIVE: ${{ inputs.archive_path }}
          TEAM_ID: ${{ inputs.apple_team_id }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [ -d "$ARCHIVE" ] || { echo "::error::No archive at $ARCHIVE (set archive_path)."; exit 1; }
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' '<dict>' \
            '  <key>method</key><string>app-store-connect</string>' \
            '  <key>signingStyle</key><string>automatic</string>' \
            "  <key>teamID</key><string>$TEAM_ID</string>" \
            '</dict>' '</plist>' > "$RUNNER_TEMP/ExportOptions.plist"

          # -allowProvisioningUpdates with the API key lets Apple create or
          # update the profile, which is why no match repository is needed.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc-key.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          IPA=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          [ -n "$IPA" ] || { echo "::error::The export produced no IPA."; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Repair the entitlements
        if: >-
          steps.gate.outputs.proceed == 'true'
          && (inputs.entitlements_path != '' || inputs.extension_entitlements != '')
        working-directory: ${{ inputs.app_dir }}
        env:
          SOURCE_REL: ${{ inputs.entitlements_path }}
          EXTENSIONS: ${{ inputs.extension_entitlements }}
          APP_NAME: ${{ inputs.app_name }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ipa-work"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          APP="$WORK/Payload/$APP_NAME"
          [ -d "$APP" ] || { echo "::error::No $APP_NAME in the IPA payload (set app_name)."; exit 1; }

          # Which keys does the project declare that a signed bundle lacks?
          # aps-environment (push) and associated-domains (universal links,
          # password autofill) are the ones the unsigned-archive route drops,
          # and nothing fails until a user notices push is dead; an app group
          # missing from a widget extension is a widget that shows nothing.
          # Checks each extension in extension_entitlements, then the app. A
          # merged file keeps everything Apple's auto-signing put there
          # (application-identifier, team-identifier, beta-reports-active).
          # Writes the bundles to re-sign, inside out, to plan.tsv.
          python3 - "$WORK" "$APP" "$SOURCE_REL" "$EXTENSIONS" <<'PY'
          import os, plistlib, subprocess, sys
          work, app, app_source, extensions = sys.argv[1:]

          def signed(bundle, out):
              subprocess.run(["codesign", "-d", "--entitlements", ":" + out, bundle],
                             check=True, capture_output=True)
              if not os.path.exists(out) or os.path.getsize(out) == 0:
                  return {}
              with open(out, "rb") as f:
                  return plistlib.load(f)

          bundles = []
          for raw in extensions.splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              name, _, source = (part.strip() for part in line.partition("="))
              path = os.path.join(app, "PlugIns", name)
              if not os.path.isdir(path):
                  sys.exit(f"::error::extension_entitlements names {name}, but the app has no PlugIns/{name}.")
              if not os.path.isfile(source):
                  sys.exit(f"::error::extension_entitlements points {name} at {source}, which does not exist.")
              bundles.append((name, path, source))
          if app_source:
              if os.path.isfile(app_source):
                  bundles.append((os.path.basename(app), app, app_source))
              else:
                  print(f"::notice::No {app_source} in this project, so the app's own entitlements are not compared.")

          plan = []
          for i, (name, path, source) in enumerate(bundles):
              with open(source, "rb") as f:
                  wanted = plistlib.load(f)
              merged = signed(path, os.path.join(work, f"current-{i}.plist"))
              missing = [k for k in wanted if k not in merged]
              if not missing:
                  continue
              for key in missing:
                  merged[key] = wanted[key]
              merged_path = os.path.join(work, f"merged-{i}.plist")
              with open(merged_path, "wb") as f:
                  plistlib.dump(merged, f)
              plan.append("\t".join([path, merged_path, name, " ".join(missing)]))
          with open(os.path.join(work, "plan.tsv"), "w") as f:
              f.write("".join(line + "\n" for line in plan))
          PY

          if [ ! -s "$WORK/plan.tsv" ]; then
            echo "::notice::The exported IPA carries every entitlement the project declares; no re-signing needed."
            rm -rf "$WORK"
            exit 0
          fi

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          sign() { # sign BUNDLE ENTITLEMENTS. Never --deep: that would stamp
            # one bundle's entitlements onto every extension inside it.
            codesign --force --keychain "$RUNNER_TEMP/build.keychain-db" \
              --sign "$SIGN_IDENTITY" --entitlements "$2" "$1"
          }
          APP_SIGNED=false
          while IFS=$'\t' read -r BUNDLE MERGED NAME MISSING; do
            echo "::warning::The export dropped from $NAME: $MISSING. Re-signing it with them."
            sign "$BUNDLE" "$MERGED"
            [ "$BUNDLE" = "$APP" ] && APP_SIGNED=true
          done < "$WORK/plan.tsv"
          if [ "$APP_SIGNED" = false ]; then
            # A re-signed extension changes the app's sealed contents, so the
            # app is signed again too, with exactly the entitlements it had.
            codesign -d --entitlements :"$WORK/app-unchanged.plist" "$APP" 2>/dev/null
            sign "$APP" "$WORK/app-unchanged.plist"
          fi
          codesign --verify --deep --strict "$APP"

          # Verify, because a re-sign that silently drops something is exactly
          # the failure this step exists to prevent.
          python3 - "$WORK" <<'PY'
          import os, plistlib, subprocess, sys
          work = sys.argv[1]
          still = []
          with open(os.path.join(work, "plan.tsv")) as f:
              rows = [line.rstrip("\n").split("\t") for line in f if line.strip()]
          for i, (bundle, merged_path, name, _) in enumerate(rows):
              out = os.path.join(work, f"after-{i}.plist")
              subprocess.run(["codesign", "-d", "--entitlements", ":" + out, bundle],
                             check=True, capture_output=True)
              with open(merged_path, "rb") as f:
                  wanted = plistlib.load(f)
              with open(out, "rb") as f:
                  have = plistlib.load(f)
              missing = [k for k in wanted if k not in have]
              if missing:
                  still.append(f"{name}: {' '.join(missing)}")
          if still:
              sys.exit("::error::The re-signed IPA is still missing " + "; ".join(still))
          PY
          rm -f "$IPA_PATH"
          (cd "$WORK" && zip -qry "$IPA_PATH" Payload)
          rm -rf "$WORK"
          echo "::notice::Re-signed and verified."

      - name: Upload artifact
        # Even when the upload fails: the signed IPA is then the one thing
        # worth keeping from the run.
        if: always() && env.IPA_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.version }}-${{ steps.resolve.outputs.build_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to App Store Connect
        id: upload
        if: steps.gate.outputs.proceed == 'true' && !inputs.dry_run
        working-directory: ${{ inputs.app_dir }}
        env:
          TRACK: ${{ inputs.track }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          NOTES: ${{ inputs.release_notes }}
          LOG: ${{ runner.temp }}/asc-upload.log
        run: |
          set -uo pipefail
          if [ "$TRACK" = testflight ]; then
            # pilot appends the build and touches no App Store version, so it
            # works while an earlier version is in review.
            fastlane pilot upload \
              --api_key_path "$RUNNER_TEMP/asc-key.json" \
              --app_identifier "$BUNDLE_ID" \
              --ipa "$IPA_PATH" \
              ${NOTES:+--changelog "$NOTES"} \
              --skip_waiting_for_build_processing false 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          else
            # deliver creates the App Store version. reject_if_possible
            # withdraws a submission that is only queued; one Apple has already
            # started cannot be undone, which preflight catches beforehand.
            fastlane deliver \
              --api_key_path "$RUNNER_TEMP/asc-key.json" \
              --app_identifier "$BUNDLE_ID" \
              --ipa "$IPA_PATH" \
              --skip_screenshots true \
              --skip_metadata true \
              --submit_for_review false \
              --reject_if_possible true \
              --precheck_include_in_app_purchases false \
              --run_precheck_before_submit false \
              --force true 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "review=uploaded" >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: steps.gate.outputs.proceed == 'true' && inputs.dry_run
        run: |
          echo "::notice::Dry run: archived, signed and exported $IPA_PATH, uploaded nothing."

      - name: Explain the store error
        if: failure() && steps.upload.outcome == 'failure'
        uses: ./.github/actions/explain-store-error
        with:
          platform: ios
          log: ${{ runner.temp }}/asc-upload.log

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/asc-key.json"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          NUMBER: ${{ steps.resolve.outputs.build_number }}
          TRACK: ${{ inputs.track }}
          REVIEW: ${{ steps.upload.outputs.review }}
          PROCEED: ${{ steps.gate.outputs.proceed }}
          REASON: ${{ steps.preflight.outputs.ios_reason }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$PROCEED" != true ]; then
            TEXT="held back: $REASON"
          elif [ "$DRY" = true ]; then
            TEXT="dry run: archived, signed and exported, uploaded nothing"
          elif [ "${REVIEW:-}" = uploaded ] && [ "$TRACK" = testflight ]; then
            TEXT="in TestFlight; submitting for review is a separate step"
          elif [ "${REVIEW:-}" = uploaded ]; then
            TEXT="uploaded to the App Store version; submit it for review when ready"
          else
            TEXT="the upload did not finish"
          fi
          {
            echo "### iOS $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| build | \`${NUMBER:-n/a}\` |"
            echo "| track | \`$TRACK\` |"
            echo "| result | $TEXT |"
          } >> "$GITHUB_STEP_SUMMARY"
