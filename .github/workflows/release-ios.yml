name: Release build (iOS)

# Archives, signs, exports and uploads an iOS build to App Store Connect.
#
# Reusable: an app repo's orchestrator calls this with `uses:` and
# `secrets: inherit`.
#
# Deliberate choices, each one a release that stopped once:
#   * preflight asks Apple first. A review in flight, an outstanding agreement
#     or an expiring certificate costs seconds here instead of 40 minutes of
#     macOS runner time.
#   * signing happens in a throwaway keychain that is deleted even when the
#     job fails.
#   * `flutter build ipa --no-codesign` plus `xcodebuild -exportArchive` signs
#     with the bare minimum entitlements and silently drops aps-environment
#     and associated-domains, which kills push notifications. This workflow
#     compares the exported IPA's entitlements with the project's, re-signs
#     only when something is missing, and verifies the result.
#   * the App Store upload rejects a queued submission for you
#     (reject_if_possible); a review Apple already started cannot be undone,
#     which is what track=testflight is for.
#   * a dry run archives, signs and exports, and uploads nothing.
#   * the macOS job never waits for Apple's processing: it uploads and ends.
#     Waiting there bills macOS minutes (ten times Linux) for a sleep, so
#     TestFlight's What to Test is attached by a Linux job, and an App Store
#     submission waits in the caller's Linux submit job.
#   * on the appstore track a Linux job writes What's New and the App Review
#     contact to the new version. Apple carries neither over from the last
#     version and refuses a submission without them. The contact and the
#     other languages' What's New come from the app's store.yml.
#   * every version is released as soon as Apple approves it. The same job
#     sets that, because deliver applies automatic_release only in a call that
#     also uploads metadata; next to --skip_metadata it is silently ignored,
#     and the version keeps whatever release type it had.

on:
  workflow_call:
    inputs:
      stack:
        description: 'flutter | ios-xcode'
        type: string
        required: true
      version:
        description: 'X.Y.Z'
        type: string
        required: true
      bundle_id:
        description: 'e.g. ch.example.app'
        type: string
        required: true
      apple_team_id:
        description: 'The 10-character team id (not a secret).'
        type: string
        required: true
      app_dir:
        type: string
        default: '.'
      track:
        description: >
          appstore = deliver, which creates the App Store version (and refuses
          while an earlier one is in review). testflight = pilot, which only
          appends the build and works during a review.
        type: string
        default: appstore
      build_number:
        description: 'Override. Empty means seconds since 2026-01-01 UTC.'
        type: string
        default: ''
      release_notes:
        description: >
          TestFlight's What to Test (track testflight) or the App Store
          version's What's New (track appstore), written by a Linux job after
          the upload. Emoji are removed for the App Store, which refuses them.
        type: string
        default: ''
      release_notes_locale:
        description: >
          The App Store localization the notes are written to. Empty takes
          store.yml's release_notes.locale, and en-US without one.
        type: string
        default: ''
      release_notes_fallbacks:
        description: >
          Track appstore: one line per other localization of the version,
          `<locale>=<text>`, e.g. `de-DE=Fehlerbehebungen und Verbesserungen.`
          Apple refuses a submission while any localization has no What's New.
          Empty takes store.yml's release_notes.app_store.
        type: string
        default: ''
      store_file:
        description: >
          The app's store.yml, from the repository root: the App Review
          contact and the What's New for the other languages. See
          shared/store-release/templates/store.yml.
        type: string
        default: ''
      flutter_version:
        description: 'Required for stack=flutter.'
        type: string
        default: ''
      xcode_version:
        description: 'e.g. 26.6. Empty leaves the runner default, which moves without warning.'
        type: string
        default: ''
      pre_build_command:
        description: >
          Shell run in app_dir before the build, for tooling an Xcode build
          phase shells out to that a runner does not ship. The one that bites
          every Firebase project is `dart pub global activate flutterfire_cli`:
          without it the Crashlytics symbol-upload phase fails the archive with
          `flutterfire: command not found`. Not a place to build.
        type: string
        default: ''
      build_command:
        description: >
          Override the archive step. Required for stack=ios-xcode. VERSION and
          BUILD_NUMBER are in the environment; it must leave an xcarchive at
          archive_path.
        type: string
        default: ''
      extra_build_args:
        description: 'Appended to the default Flutter build command.'
        type: string
        default: ''
      archive_path:
        description: 'xcarchive path relative to app_dir.'
        type: string
        default: build/ios/archive/Runner.xcarchive
      app_name:
        description: 'The .app inside the archive and the IPA payload.'
        type: string
        default: Runner.app
      entitlements_path:
        description: >
          The project's entitlements file, relative to app_dir. Used to detect
          and repair entitlements the export dropped. Empty disables the check.
        type: string
        default: ios/Runner/Runner.entitlements
      extension_entitlements:
        description: >
          One line per app extension, `<Name>.appex=<entitlements file relative
          to app_dir>`, e.g. a widget's app group. Checked and repaired like
          the app's own; extensions are re-signed inside out, never with --deep,
          which would give them the app's entitlements.
        type: string
        default: ''
      preflight:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      runner:
        type: string
        default: macos-26
      environment:
        type: string
        default: production
      timeout_minutes:
        type: number
        default: 120
    outputs:
      build_number:
        value: ${{ jobs.ios.outputs.build_number }}
      review:
        description: 'uploaded | dry-run | skipped'
        value: ${{ jobs.ios.outputs.review }}
    secrets:
      APPLE_DISTRIBUTION_P12_B64:
        required: false
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_B64:
        required: false
      # Build-time values that must not be committed (a RevenueCat key, an
      # API endpoint), as one flat JSON object; the Flutter build gets it via
      # --dart-define-from-file. tools/set-store-secrets.sh --dart-defines sets it.
      DART_DEFINES_JSON:
        required: false
      # The app's own secret files, for values the platform reads rather than
      # Dart (a Maps SDK key in an xcconfig or android/local.properties): one
      # JSON object of path (relative to app_dir) to contents. Written before
      # the build, removed after it. actions/secret-files/secret_files.py.
      APP_SECRET_FILES_JSON:
        required: false
      # The App Review contact normally comes from store.yml. These fill in
      # what store.yml leaves empty, for a public repo that should not show
      # an email address or phone number.
      APP_REVIEW_FIRST_NAME:
        required: false
      APP_REVIEW_LAST_NAME:
        required: false
      APP_REVIEW_EMAIL:
        required: false
      APP_REVIEW_PHONE:
        required: false

jobs:
  ios:
    name: iOS ${{ inputs.version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    outputs:
      build_number: ${{ steps.resolve.outputs.build_number }}
      review: ${{ steps.upload.outputs.review || 'skipped' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$P12" ] || missing="$missing APPLE_DISTRIBUTION_P12_B64"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing APP_STORE_CONNECT_API_KEY_P8_B64"
          if [ -n "$missing" ]; then
            echo "::error::Missing on the ${{ inputs.environment }} environment:$missing. The store-release skill sets them: skills/store-release/references/secrets.md"
            exit 1
          fi
          # The export needs the API key even for a dry run: Apple issues the
          # provisioning profile at export time.

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          stack: ${{ inputs.stack }}
          flutter-version: ${{ inputs.flutter_version }}
          xcode-version: ${{ inputs.xcode_version }}
          # Always: sigh fetches the App Store profiles, even for a dry run.
          install-fastlane: 'true'

      - name: Preflight
        id: preflight
        if: inputs.preflight && !inputs.dry_run
        uses: ./.github/actions/preflight
        with:
          platforms: ios
          version: ${{ inputs.version }}
          ios-bundle-id: ${{ inputs.bundle_id }}
          ios-track: ${{ inputs.track }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-key-p8-base64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}

      - name: Held back
        id: gate
        env:
          OK: ${{ steps.preflight.outcome == 'skipped' && 'true' || steps.preflight.outputs.ios_ok }}
          REASON: ${{ steps.preflight.outputs.ios_reason }}
        run: |
          set -euo pipefail
          if [ "$OK" = false ]; then
            echo "::warning::iOS is held back this run, so nothing is built: $REASON"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build number
        id: resolve
        if: steps.gate.outputs.proceed == 'true'
        env:
          GIVEN: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # The same clock scheme as Android, so one release carries one number
          # on both stores and a laptop build can never collide with CI.
          NUMBER="${GIVEN:-$(( $(date -u +%s) - 1767225600 ))}"
          [ "$NUMBER" -gt 0 ] || { echo "::error::build number $NUMBER is not usable"; exit 1; }
          echo "build_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice title=iOS::${{ inputs.version }} ($NUMBER)"

      - name: Write the App Store Connect key
        if: steps.gate.outputs.proceed == 'true'
        env:
          P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"
          # fastlane's CLI takes the key as one JSON file, which is why no
          # Fastfile is needed here: the app's own fastlane setup is untouched.
          jq -n --arg id "$KEY_ID" --arg issuer "$ISSUER" --rawfile key "$RUNNER_TEMP/asc-key.p8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, duration: 1200, in_house: false}' \
            > "$RUNNER_TEMP/asc-key.json"
          chmod 600 "$RUNNER_TEMP/asc-key.json"

      - name: Setup signing
        if: steps.gate.outputs.proceed == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${P12_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Ours first, then the ones that were there (one word each, on purpose).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -m1 "Apple Distribution" | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Apple Distribution identity in the keychain. APPLE_DISTRIBUTION_P12_B64 is not a distribution certificate with its private key, or APPLE_DISTRIBUTION_P12_PASSWORD is wrong."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "::notice::Signing as $IDENTITY"

      - name: Dependencies
        if: steps.gate.outputs.proceed == 'true' && inputs.stack == 'flutter'
        working-directory: ${{ inputs.app_dir }}
        run: flutter pub get

      - name: App secret files
        # Secrets the platform reads rather than Dart (a Maps SDK key in an
        # xcconfig or local.properties), from APP_SECRET_FILES_JSON; never
        # through an input, which would put them in a process listing.
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/secret-files
        with:
          command: write
          dir: ${{ inputs.app_dir }}
          files: ${{ secrets.APP_SECRET_FILES_JSON }}

      - name: Pre-build command
        if: steps.gate.outputs.proceed == 'true' && inputs.pre_build_command != ''
        working-directory: ${{ inputs.app_dir }}
        env:
          COMMAND: ${{ inputs.pre_build_command }}
        run: |
          set -euo pipefail
          bash -c "$COMMAND"

      - name: Archive
        if: steps.gate.outputs.proceed == 'true'
        working-directory: ${{ inputs.app_dir }}
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ steps.resolve.outputs.build_number }}
          STACK: ${{ inputs.stack }}
          COMMAND: ${{ inputs.build_command }}
          EXTRA: ${{ inputs.extra_build_args }}
          DEFINES: ${{ secrets.DART_DEFINES_JSON }}
        run: |
          set -euo pipefail
          # Build defines from the DART_DEFINES_JSON secret go in as a file:
          # a --dart-define argument would be in every process listing.
          DART_DEFINES_ARG=""
          if [ -n "$DEFINES" ]; then
            DEFINES_FILE="$RUNNER_TEMP/dart-defines.json"
            trap 'rm -f "$DEFINES_FILE"' EXIT
            printf '%s' "$DEFINES" > "$DEFINES_FILE"
            chmod 600 "$DEFINES_FILE"
            if ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d, dict) and d; print("::notice::Build defines: " + ", ".join(sorted(d)))' "$DEFINES_FILE"; then
              echo "::error::DART_DEFINES_JSON is not a non-empty JSON object."
              exit 1
            fi
            DART_DEFINES_ARG="--dart-define-from-file=$DEFINES_FILE"
          fi
          # A build_command can pass it on itself.
          export DART_DEFINES_ARG
          if [ -n "$COMMAND" ]; then
            bash -c "$COMMAND"
          elif [ "$STACK" = flutter ]; then
            # Unsigned, then exported with distribution signing: archiving
            # signed needs a development certificate the runner does not have.
            # shellcheck disable=SC2086
            flutter build ipa --no-codesign \
              --build-name="$VERSION" --build-number="$BUILD_NUMBER" $EXTRA $DART_DEFINES_ARG
          else
            echo "::error::stack=ios-xcode needs build_command, leaving an xcarchive at archive_path."
            exit 1
          fi

      - name: Provisioning profiles
        # Automatic signing with an App Store Connect key goes for Apple's
        # cloud-managed certificate, which only an Admin key may use: with an
        # App Manager key the export fails ("Cloud signing permission error",
        # then "No profiles ... were found"). So, like a local fastlane
        # release: sigh finds or creates an App Store profile for the app and
        # every extension in the archive, for the certificate in our keychain,
        # and the export signs manually with those.
        id: profiles
        if: steps.gate.outputs.proceed == 'true'
        working-directory: ${{ inputs.app_dir }}
        env:
          ARCHIVE: ${{ inputs.archive_path }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          APP="$ARCHIVE/Products/Applications/$APP_NAME"
          [ -d "$APP" ] || { echo "::error::No $APP_NAME in $ARCHIVE (set archive_path / app_name)."; exit 1; }
          IDS=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -d "$EXT" ] || continue
            IDS="$IDS $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
          done
          OUT="$RUNNER_TEMP/profiles"
          mkdir -p "$OUT" "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          : > "$OUT/map.tsv"
          for ID in $IDS; do
            fastlane sigh \
              --api_key_path "$RUNNER_TEMP/asc-key.json" \
              --app_identifier "$ID" \
              --platform ios \
              --output_path "$OUT" \
              --filename "$ID.mobileprovision" \
              --skip_install true
            security cms -D -i "$OUT/$ID.mobileprovision" > "$OUT/$ID.plist"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$OUT/$ID.plist")
            cp "$OUT/$ID.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            cp "$OUT/$ID.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
            printf '%s\t%s\n' "$ID" "$UUID" >> "$OUT/map.tsv"
            echo "::notice::App Store profile for $ID: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$OUT/$ID.plist")"
          done

      - name: Export IPA
        if: steps.gate.outputs.proceed == 'true'
        working-directory: ${{ inputs.app_dir }}
        env:
          ARCHIVE: ${{ inputs.archive_path }}
          TEAM_ID: ${{ inputs.apple_team_id }}
        run: |
          set -euo pipefail
          [ -d "$ARCHIVE" ] || { echo "::error::No archive at $ARCHIVE (set archive_path)."; exit 1; }
          # Manual signing with the profiles from the step before and the
          # certificate in our keychain; no cloud signing, no Admin key.
          python3 - "$RUNNER_TEMP/profiles/map.tsv" "$TEAM_ID" "$SIGN_IDENTITY" "$RUNNER_TEMP/ExportOptions.plist" <<'PY'
          import plistlib, sys
          map_path, team, identity, out = sys.argv[1:]
          with open(map_path) as f:
              profiles = dict(line.rstrip("\n").split("\t") for line in f if line.strip())
          with open(out, "wb") as f:
              plistlib.dump({
                  "method": "app-store-connect",
                  "signingStyle": "manual",
                  "teamID": team,
                  "signingCertificate": identity,
                  "provisioningProfiles": profiles,
              }, f)
          PY

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          [ -n "$IPA" ] || { echo "::error::The export produced no IPA."; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Repair the entitlements
        if: >-
          steps.gate.outputs.proceed == 'true'
          && (inputs.entitlements_path != '' || inputs.extension_entitlements != '')
        working-directory: ${{ inputs.app_dir }}
        env:
          SOURCE_REL: ${{ inputs.entitlements_path }}
          EXTENSIONS: ${{ inputs.extension_entitlements }}
          APP_NAME: ${{ inputs.app_name }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ipa-work"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          APP="$WORK/Payload/$APP_NAME"
          [ -d "$APP" ] || { echo "::error::No $APP_NAME in the IPA payload (set app_name)."; exit 1; }

          # Which keys does the project declare that a signed bundle lacks?
          # aps-environment (push) and associated-domains (universal links,
          # password autofill) are the ones the unsigned-archive route drops,
          # and nothing fails until a user notices push is dead; an app group
          # missing from a widget extension is a widget that shows nothing.
          # Checks each extension in extension_entitlements, then the app. A
          # merged file keeps everything Apple's auto-signing put there
          # (application-identifier, team-identifier, beta-reports-active).
          # Writes the bundles to re-sign, inside out, to plan.tsv.
          python3 - "$WORK" "$APP" "$SOURCE_REL" "$EXTENSIONS" <<'PY'
          import os, plistlib, subprocess, sys
          work, app, app_source, extensions = sys.argv[1:]

          def signed(bundle, out):
              subprocess.run(["codesign", "-d", "--entitlements", ":" + out, bundle],
                             check=True, capture_output=True)
              if not os.path.exists(out) or os.path.getsize(out) == 0:
                  return {}
              with open(out, "rb") as f:
                  return plistlib.load(f)

          bundles = []
          for raw in extensions.splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              name, _, source = (part.strip() for part in line.partition("="))
              path = os.path.join(app, "PlugIns", name)
              if not os.path.isdir(path):
                  sys.exit(f"::error::extension_entitlements names {name}, but the app has no PlugIns/{name}.")
              if not os.path.isfile(source):
                  sys.exit(f"::error::extension_entitlements points {name} at {source}, which does not exist.")
              bundles.append((name, path, source))
          if app_source:
              if os.path.isfile(app_source):
                  bundles.append((os.path.basename(app), app, app_source))
              else:
                  print(f"::notice::No {app_source} in this project, so the app's own entitlements are not compared.")

          plan = []
          for i, (name, path, source) in enumerate(bundles):
              with open(source, "rb") as f:
                  wanted = plistlib.load(f)
              merged = signed(path, os.path.join(work, f"current-{i}.plist"))
              missing = [k for k in wanted if k not in merged]
              if not missing:
                  continue
              for key in missing:
                  merged[key] = wanted[key]
              merged_path = os.path.join(work, f"merged-{i}.plist")
              with open(merged_path, "wb") as f:
                  plistlib.dump(merged, f)
              plan.append("\t".join([path, merged_path, name, " ".join(missing)]))
          with open(os.path.join(work, "plan.tsv"), "w") as f:
              f.write("".join(line + "\n" for line in plan))
          PY

          if [ ! -s "$WORK/plan.tsv" ]; then
            echo "::notice::The exported IPA carries every entitlement the project declares; no re-signing needed."
            rm -rf "$WORK"
            exit 0
          fi

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          sign() { # sign BUNDLE ENTITLEMENTS. Never --deep: that would stamp
            # one bundle's entitlements onto every extension inside it.
            codesign --force --keychain "$RUNNER_TEMP/build.keychain-db" \
              --sign "$SIGN_IDENTITY" --entitlements "$2" "$1"
          }
          APP_SIGNED=false
          while IFS=$'\t' read -r BUNDLE MERGED NAME MISSING; do
            echo "::warning::The export dropped from $NAME: $MISSING. Re-signing it with them."
            sign "$BUNDLE" "$MERGED"
            [ "$BUNDLE" = "$APP" ] && APP_SIGNED=true
          done < "$WORK/plan.tsv"
          if [ "$APP_SIGNED" = false ]; then
            # A re-signed extension changes the app's sealed contents, so the
            # app is signed again too, with exactly the entitlements it had.
            codesign -d --entitlements :"$WORK/app-unchanged.plist" "$APP" 2>/dev/null
            sign "$APP" "$WORK/app-unchanged.plist"
          fi
          codesign --verify --deep --strict "$APP"

          # Verify, because a re-sign that silently drops something is exactly
          # the failure this step exists to prevent.
          python3 - "$WORK" <<'PY'
          import os, plistlib, subprocess, sys
          work = sys.argv[1]
          still = []
          with open(os.path.join(work, "plan.tsv")) as f:
              rows = [line.rstrip("\n").split("\t") for line in f if line.strip()]
          for i, (bundle, merged_path, name, _) in enumerate(rows):
              out = os.path.join(work, f"after-{i}.plist")
              subprocess.run(["codesign", "-d", "--entitlements", ":" + out, bundle],
                             check=True, capture_output=True)
              with open(merged_path, "rb") as f:
                  wanted = plistlib.load(f)
              with open(out, "rb") as f:
                  have = plistlib.load(f)
              missing = [k for k in wanted if k not in have]
              if missing:
                  still.append(f"{name}: {' '.join(missing)}")
          if still:
              sys.exit("::error::The re-signed IPA is still missing " + "; ".join(still))
          PY
          rm -f "$IPA_PATH"
          (cd "$WORK" && zip -qry "$IPA_PATH" Payload)
          rm -rf "$WORK"
          echo "::notice::Re-signed and verified."

      - name: Upload artifact
        # Even when the upload fails: the signed IPA is then the one thing
        # worth keeping from the run.
        if: always() && env.IPA_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.version }}-${{ steps.resolve.outputs.build_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to App Store Connect
        id: upload
        if: steps.gate.outputs.proceed == 'true' && !inputs.dry_run
        working-directory: ${{ inputs.app_dir }}
        env:
          TRACK: ${{ inputs.track }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          LOG: ${{ runner.temp }}/asc-upload.log
        run: |
          set -uo pipefail
          if [ "$TRACK" = testflight ]; then
            # pilot appends the build and touches no App Store version, so it
            # works while an earlier version is in review. No --changelog and
            # no waiting: with either, pilot sits on this runner until Apple
            # has processed the build. The testflight-notes job attaches the
            # notes from Linux.
            fastlane pilot upload \
              --api_key_path "$RUNNER_TEMP/asc-key.json" \
              --app_identifier "$BUNDLE_ID" \
              --ipa "$IPA_PATH" \
              --skip_waiting_for_build_processing true 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          else
            # deliver creates the App Store version. reject_if_possible
            # withdraws a submission that is only queued; one Apple has already
            # started cannot be undone, which preflight catches beforehand.
            fastlane deliver \
              --api_key_path "$RUNNER_TEMP/asc-key.json" \
              --app_identifier "$BUNDLE_ID" \
              --ipa "$IPA_PATH" \
              --skip_screenshots true \
              --skip_metadata true \
              --submit_for_review false \
              --reject_if_possible true \
              --precheck_include_in_app_purchases false \
              --run_precheck_before_submit false \
              --force true 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "review=uploaded" >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: steps.gate.outputs.proceed == 'true' && inputs.dry_run
        run: |
          echo "::notice::Dry run: archived, signed and exported $IPA_PATH, uploaded nothing."

      - name: Explain the store error
        if: failure() && steps.upload.outcome == 'failure'
        uses: ./.github/actions/explain-store-error
        with:
          platform: ios
          log: ${{ runner.temp }}/asc-upload.log

      - name: Remove the app secret files
        if: always()
        uses: ./.github/actions/secret-files
        with:
          command: clean
          dir: ${{ inputs.app_dir }}

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/asc-key.json"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          NUMBER: ${{ steps.resolve.outputs.build_number }}
          TRACK: ${{ inputs.track }}
          REVIEW: ${{ steps.upload.outputs.review }}
          PROCEED: ${{ steps.gate.outputs.proceed }}
          REASON: ${{ steps.preflight.outputs.ios_reason }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$PROCEED" != true ]; then
            TEXT="held back: $REASON"
          elif [ "$DRY" = true ]; then
            TEXT="dry run: archived, signed and exported, uploaded nothing"
          elif [ "${REVIEW:-}" = uploaded ] && [ "$TRACK" = testflight ]; then
            TEXT="in TestFlight; submitting for review is a separate step"
          elif [ "${REVIEW:-}" = uploaded ]; then
            TEXT="uploaded to the App Store version; submit it for review when ready"
          else
            TEXT="the upload did not finish"
          fi
          {
            echo "### iOS $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| build | \`${NUMBER:-n/a}\` |"
            echo "| track | \`$TRACK\` |"
            echo "| result | $TEXT |"
          } >> "$GITHUB_STEP_SUMMARY"

  # TestFlight's What to Test can be set once Apple lists the uploaded build,
  # usually a few minutes after the upload and long before processing ends.
  # That wait is a sleep, and it belongs on Linux.
  testflight-notes:
    name: TestFlight notes ${{ inputs.version }}
    needs: ios
    if: >-
      inputs.track == 'testflight' && inputs.release_notes != ''
      && !inputs.dry_run && needs.ios.outputs.review == 'uploaded'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      # Once vendored, the action below is a local path, which only resolves
      # after a checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          stack: none

      - name: Attach What to Test
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
          NOTES: ${{ inputs.release_notes }}
          LOG: ${{ runner.temp }}/testflight-notes.log
        run: |
          set -uo pipefail
          printf '%s' "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          trap 'rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/asc.json"' EXIT
          jq -n --arg id "$KEY_ID" --arg issuer "$ISSUER" --rawfile key "$RUNNER_TEMP/asc.p8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, duration: 1200, in_house: false}' > "$RUNNER_TEMP/asc.json"
          # Until Apple lists the build, pilot answers "No build to
          # distribute!", the one failure worth retrying. From then on it sets
          # the notes even while the build is still processing, and with
          # --skip_waiting_for_build_processing it returns right after.
          # --app_platform because there is no IPA here to read it from.
          for attempt in $(seq 1 40); do
            fastlane pilot distribute \
              --api_key_path "$RUNNER_TEMP/asc.json" \
              --app_identifier "$BUNDLE_ID" \
              --app_platform ios \
              --app_version "$VERSION" \
              --build_number "$BUILD_NUMBER" \
              --changelog "$NOTES" \
              --distribute_external false \
              --skip_waiting_for_build_processing true 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
            [ "$rc" -eq 0 ] && exit 0
            grep -q "No build to distribute" "$LOG" || exit "$rc"
            echo "Build $BUILD_NUMBER is not listed yet (attempt $attempt of 40), trying again in a minute."
            sleep 60
          done
          echo "::error::Apple did not list build $BUILD_NUMBER within 40 minutes. The build is uploaded; only What to Test is missing, and can be added in App Store Connect."
          exit 1

  # What's New, the App Review contact and the release type for the App Store
  # version the upload just created or reused. Apple copies none of them from
  # the previous version, and refuses a submission without the first two, so
  # this runs before the caller's submit job (which waits for this whole
  # workflow). It talks only to the API, so it runs on Linux.
  appstore-notes:
    name: App Store notes ${{ inputs.version }}
    needs: ios
    if: >-
      inputs.track == 'appstore' && !inputs.dry_run
      && needs.ios.outputs.review == 'uploaded'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      # Once vendored, the action below is a local path, which only resolves
      # after a checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          stack: none

      - name: Read store.yml
        id: store
        uses: ./.github/actions/changelog
        with:
          command: store
          store: ${{ inputs.store_file }}

      - name: Write What's New, the review contact and the release type
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          LOCALE: ${{ inputs.release_notes_locale }}
          FALLBACKS: ${{ inputs.release_notes_fallbacks }}
          STORE_JSON: ${{ steps.store.outputs.store }}
          STORE_FILE: ${{ inputs.store_file }}
          REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/appstore-notes"
          # A tree shaped like an app's fastlane/metadata, holding only what
          # this job sets. deliver sends a field only when it has a file, so
          # the description, keywords and everything else stay as they are.
          python3 - "$WORK" <<'PY'
          import json, os, re, sys
          work, limit = sys.argv[1], 4000
          meta = os.path.join(work, "fastlane", "metadata")
          os.makedirs(meta, exist_ok=True)
          env = os.environ
          store = json.loads(env["STORE_JSON"] or "{}")
          notes_cfg = store.get("release_notes") or {}
          locale = env["LOCALE"].strip() or str(notes_cfg.get("locale") or "").strip() or "en-US"
          wrote = []

          def write(rel, text):
              path = os.path.join(meta, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

          def clean(text):
              # Apple refuses emoji in What's New.
              text = re.sub("[\U0001F000-\U0001FFFF☀-➿️‍]", "", text)
              text = "\n".join(re.sub(r"[ \t]{2,}", " ", l).rstrip() for l in text.strip().splitlines())
              if len(text) <= limit:
                  return text
              lines, kept = [l for l in text.splitlines() if l.strip()], []
              for line in lines[:-1]:
                  if len("\n".join(kept + [line, lines[-1]])) > limit:
                      break
                  kept.append(line)
              print(f"::warning::What's New is {len(text)} characters; kept {len(kept) + 1} of {len(lines)} lines to fit {limit}.")
              return "\n".join(kept + [lines[-1]])

          # The other localizations: the input, or else store.yml's
          # release_notes.app_store, a mapping of locale to text.
          fallbacks = []
          for line in env["FALLBACKS"].splitlines():
              if not line.strip():
                  continue
              loc, sep, text = line.partition("=")
              if not sep or not text.strip():
                  print(f"::error::release_notes_fallbacks line without <locale>=<text>: {line}")
                  sys.exit(1)
              fallbacks.append((loc.strip(), text))
          if not fallbacks:
              fallbacks = [(str(k), str(v)) for k, v in (notes_cfg.get("app_store") or {}).items()]

          notes = clean(env["NOTES"])
          if notes:
              write(f"{locale}/release_notes.txt", notes)
              wrote.append(f"What's New ({locale}, {len(notes)} characters)")
              for loc, text in fallbacks:
                  if loc == locale:
                      continue
                  write(f"{loc}/release_notes.txt", clean(text))
                  wrote.append(f"What's New ({loc})")
          else:
              print("::notice::No release notes, so What's New stays as it is.")

          # The App Review contact: store.yml, each empty value from the
          # APP_REVIEW_* secret of the same name.
          review = store.get("app_review") or {}
          contact = {}
          for key in ("first_name", "last_name", "email", "phone"):
              contact[key] = str(review.get(key) or "").strip() or env[f"REVIEW_{key.upper()}"].strip()
          if all(contact.values()):
              for key, name in (("first_name", "first_name"), ("last_name", "last_name"),
                                ("email", "email_address"), ("phone", "phone_number")):
                  write(f"review_information/{name}.txt", contact[key])
              wrote.append("the App Review contact")
          elif any(contact.values()):
              missing = ", ".join(k for k, v in contact.items() if not v)
              print(f"::error::The App Review contact lacks {missing}. Fill in app_review in {env['STORE_FILE'] or 'store.yml'} (or the APP_REVIEW_* secret).")
              sys.exit(1)
          else:
              print("::warning::No App Review contact in store.yml, so the version keeps whatever contact it has. Apple refuses a submission without one.")

          with open(os.path.join(work, "wrote.txt"), "w") as f:
              f.write("\n".join(wrote + ["release when approved"]))
          PY
          echo "Writing: $(paste -sd ',' "$WORK/wrote.txt" | sed 's/,/, /g')"

          printf '%s' "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          trap 'rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/asc.json"' EXIT
          jq -n --arg id "$KEY_ID" --arg issuer "$ISSUER" --rawfile key "$RUNNER_TEMP/asc.p8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, duration: 1200, in_house: false}' > "$RUNNER_TEMP/asc.json"
          # Run inside the tree: deliver without a binary asks whether to set
          # itself up unless it finds fastlane/metadata in the working
          # directory, and --force does not skip that question.
          # --automatic_release: every version goes live as soon as Apple
          # approves it. Only a call like this one, which uploads metadata,
          # applies it; the submit job's --skip_metadata call would ignore it.
          cd "$WORK"
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc.json" \
            --app_identifier "$BUNDLE_ID" \
            --app_version "$VERSION" \
            --skip_binary_upload true \
            --skip_screenshots true \
            --automatic_release true \
            --submit_for_review false \
            --run_precheck_before_submit false \
            --force true
