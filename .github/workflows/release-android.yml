name: Release build (Android)

# Builds a signed AAB and uploads it to Google Play.
#
# Reusable: the app's release.yml calls this with `uses:` and
# `secrets: inherit`. Every step is a command of
# .github/store-release/android.sh, the same one `release.sh --local` runs on
# a Mac; this file only adds what a runner needs (disk space, the toolchain,
# the secrets). How the app is built comes from its store.yml.
#
# Deliberate choices, each one a release that stopped once:
#   * preflight asks Google whether this can ship before the build, not after.
#   * a dry run builds and signs everything, and Play validates the upload
#     without committing it.
#   * secrets are written to files, never passed as arguments, and removed again.

on:
  workflow_call:
    inputs:
      version:
        description: 'X.Y.Z. The version name; the code comes from the clock.'
        type: string
        required: true
      track:
        description: 'internal | alpha | beta | production'
        type: string
        default: internal
      release_status:
        description: >
          completed = upload and send for review (managed publishing then holds
          it until someone presses Publish). draft = upload only; required for
          an app that has never been published.
        type: string
        default: completed
      build_number:
        description: "Override the version code. Empty takes store.yml's android.build_number scheme."
        type: string
        default: ''
      release_notes:
        description: >
          Play's What's new. Over 500 characters, whole lines are kept from the
          top, plus the last line. The other languages get store.yml's lines.
        type: string
        default: ''
      runner:
        description: "store.yml's android.runner, which the caller's prepare job reads."
        type: string
        default: ubuntu-24.04
      preflight:
        description: 'Ask Google whether this can ship before building.'
        type: boolean
        default: true
      dry_run:
        description: 'Build and sign, upload nothing. Play still validates the upload.'
        type: boolean
        default: false
      environment:
        description: 'GitHub environment holding the secrets.'
        type: string
        default: production
      timeout_minutes:
        type: number
        default: 60
    outputs:
      build_number:
        description: 'The version code that was built.'
        value: ${{ jobs.android.outputs.build_number }}
      review:
        description: 'sent | draft | held | dry-run | skipped'
        value: ${{ jobs.android.outputs.review }}
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_SHA1:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      DART_DEFINES_JSON:
        required: false
      APP_SECRET_FILES_JSON:
        required: false

jobs:
  android:
    name: Android ${{ inputs.version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    outputs:
      build_number: ${{ steps.prepare.outputs.build_number }}
      review: ${{ steps.upload.outputs.review || (steps.gate.outputs.proceed == 'false' && 'held') || 'skipped' }}
    env:
      VERSION: ${{ inputs.version }}
      PLAY_TRACK: ${{ inputs.track }}
      RELEASE_STATUS: ${{ inputs.release_status }}
      DRY_RUN: ${{ inputs.dry_run }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # store.yml's build_number: commits counts the whole history.
          fetch-depth: 0

      - name: store.yml
        id: config
        run: ruby .github/store-release/config.rb github

      - name: Free disk space
        # A Flutter release build (Gradle caches, the NDK, every ABI) ran the
        # hosted Ubuntu runner out of disk mid-build (CakeDay, 2026-11-11).
        # These preinstalled toolchains are never used by this job; the
        # Android SDK and the JDKs stay.
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          before=$(df -h / | awk 'NR==2 {print $4}')
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google || true
          docker image prune --all --force > /dev/null 2>&1 || true
          echo "::notice::Disk: $before free before, $(df -h / | awk 'NR==2 {print $4}') free after cleanup"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          stack: ${{ steps.config.outputs.android_stack }}
          flutter-version: ${{ steps.config.outputs.flutter }}
          java-version: ${{ steps.config.outputs.android_java }}
          # A dry run uploads too (validate only), so always.
          install-fastlane: 'true'

      - name: Preflight
        id: preflight
        if: inputs.preflight && !inputs.dry_run
        uses: ./.github/actions/preflight
        with:
          platforms: android
          version: ${{ inputs.version }}
          android-package: ${{ steps.config.outputs.android_package }}
          play-track: ${{ inputs.track }}
          play-service-account-json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Held back
        id: gate
        env:
          OK: ${{ steps.preflight.outcome == 'skipped' && 'true' || steps.preflight.outputs.android_ok }}
          REASON: ${{ steps.preflight.outputs.android_reason }}
        run: |
          if [ "$OK" = false ]; then
            echo "::warning::Android is held back this run, so nothing is built: $REASON"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version code and signing key
        id: prepare
        if: steps.gate.outputs.proceed == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: .github/store-release/android.sh prepare

      - name: App secret files
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/secret-files
        with:
          command: write
          dir: ${{ steps.config.outputs.app_dir }}
          files: ${{ secrets.APP_SECRET_FILES_JSON }}

      - name: Build AAB
        if: steps.gate.outputs.proceed == 'true'
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
          ANDROID_UPLOAD_KEY_SHA1: ${{ secrets.ANDROID_UPLOAD_KEY_SHA1 }}
        run: .github/store-release/android.sh build

      - name: Upload artifact
        if: always() && env.AAB_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.version }}-${{ steps.prepare.outputs.build_number }}
          path: ${{ env.AAB_PATH }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Google Play
        id: upload
        if: steps.gate.outputs.proceed == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ inputs.release_notes }}
        run: .github/store-release/android.sh upload

      - name: Remove the app secret files and keys
        if: always()
        uses: ./.github/actions/secret-files
        with:
          command: clean
          dir: ${{ steps.config.outputs.app_dir }}

      - name: Clean up
        if: always()
        run: .github/store-release/android.sh cleanup

      - name: Summary
        if: always()
        env:
          REVIEW: ${{ steps.upload.outputs.review }}
          HELD_REASON: ${{ steps.preflight.outputs.android_reason }}
        run: .github/store-release/android.sh summary
