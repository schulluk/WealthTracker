name: wealth_tracker
description: "Wealth Tracker - Track your financial portfolio"
publish_to: 'none'

version: 1.3.3+51

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Networking
  dio: ^5.11.1

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Secure Storage & Biometrics
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

  # Firebase
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0

  # Charts
  fl_chart: ^1.2.0

  # Navigation
  go_router: ^18.0.2

  # UI Helpers
  intl: ^0.20.3
  url_launcher: ^6.3.3

  # Cryptography (for KEK-based authentication)
  cryptography: ^2.9.0

  # Local Notifications (for sync reminders)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Shared Preferences (for last sync timestamp)
  shared_preferences: ^2.5.5

  # Permission handling (for notification permissions)
  permission_handler: ^13.0.2
  app_settings: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

  # App Icon
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
